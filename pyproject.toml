[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-benchmark-runner"
version = "0.1.0"
description = "Extensible evaluation core for mathematical reasoning benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
experiment = [
  "openai>=1.68",
  "python-dotenv>=1.0",
  "rich>=13.9",
]
official-checkers = [
  "antlr4-python3-runtime==4.11.*",
  "loguru>=0.7",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyparsing>=3.1",
  "regex>=2024.5",
  "scipy>=1.12",
  "sympy>=1.12",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "benchmark_aflow*",
  "benchmark_core*",
  "benchmark_datasets*",
  "benchmark_experiments*",
  "benchmark_methods*",
  "benchmark_smoke*",
  "executors*",
  "model_backends*",
  "scorers*",
]
