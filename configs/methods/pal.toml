name = "pal"
status = "runtime_ready"
adapter = "adapters.pal.PALAdapter"
source_path = "../../../methods/PAL"

[integration]
prompt_family = "math"
execution_backend = "sandbox_required"
supported_output = "python_program"
model_calls_per_problem = 1
prompt_source = "pal/prompt/math_prompts.py:MATH_CHAT_BETA_PROMPT"

[fairness]
min_model_calls_per_problem = 1
max_model_calls_per_problem = 1
allowed_inference_overrides = []

[security]
executor = "executors.RestrictedPythonExecutor"
allowed_imports = ["decimal", "fractions", "math"]
network_available = false
