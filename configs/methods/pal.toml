name = "pal"
status = "runtime_ready"
adapter = "adapters.pal.PALAdapter"
source_path = "../../../methods/PAL"

[integration]
prompt_family = "dataset-routed-math-program"
execution_backend = "sandbox_required"
supported_output = "python_program"
model_calls_per_problem = 1
gsm_prompt_source = "pal/prompt/math_prompts.py:MATH_CHAT_BETA_PROMPT"
adapted_datasets = ["math-perturb", "harp", "u-math-text-only"]
submission_rendering = "execute solution(), render mathematical objects as LaTeX, then use shared final-answer envelope"

[fairness]
min_model_calls_per_problem = 1
max_model_calls_per_problem = 1
allowed_inference_overrides = []

[security]
executor = "executors.RestrictedPythonExecutor"
protocol = "pal-python-v5"
allowed_imports = [
  "cmath",
  "collections",
  "decimal",
  "fractions",
  "functools",
  "itertools",
  "math",
  "numpy",
  "scipy",
  "statistics",
  "sympy",
  "sys",
]
network_available = false
