name = "self_refine"
status = "runtime_ready"
adapter = "adapters.self_refine.SelfRefineAdapter"
source_path = "../../../methods/Self-Refine"

[integration]
task_template = "gsm"
stages = ["init", "feedback", "iterate"]
external_dependency = "replaced_by_shared_model_backend"

[method]
max_refinements = 4

[method.feedback_inference_overrides]
temperature = 0.7

[fairness]
min_model_calls_per_problem = 2
max_model_calls_per_problem = 5
allowed_inference_overrides = ["temperature"]

[security]
executor = "executors.RestrictedPythonExecutor"
allowed_imports = ["decimal", "fractions", "math"]
network_available = false
