name = "self_refine"
status = "runtime_ready"
adapter = "adapters.self_refine.SelfRefineAdapter"
source_path = "../../../methods/Self-Refine"

[integration]
task_profiles = ["gsm-python", "text-math"]
gsm_datasets = ["gsm1k"]
text_datasets = ["math-perturb", "harp", "u-math-text-only"]
stages = ["init", "feedback", "iterate"]
external_dependency = "replaced_by_shared_model_backend"

[method]
max_refinements = 4

[method.gsm_initial_inference_overrides]
max_output_tokens = 1024
stop = ["\n\n"]

[method.gsm_feedback_inference_overrides]
temperature = 0.7
max_output_tokens = 2048
stop = ["### END"]

[method.text_feedback_inference_overrides]
temperature = 0.7

[fairness]
min_model_calls_per_problem = 2
max_model_calls_per_problem = 5
allowed_inference_overrides = ["temperature", "max_output_tokens", "stop"]

[security]
executor = "executors.RestrictedPythonExecutor"
protocol = "pal-python-v5"
allowed_imports = [
  "cmath",
  "collections",
  "decimal",
  "fractions",
  "functools",
  "itertools",
  "math",
  "numpy",
  "scipy",
  "statistics",
  "sympy",
  "sys",
]
network_available = false
