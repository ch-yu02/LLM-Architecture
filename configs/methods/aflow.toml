name = "aflow"
status = "runtime_ready"
adapter = "adapters.aflow.AFlowAdapter"
source_path = "../../../methods/AFlow"

[integration]
upstream_python = "3.9"
config_template = "../../../methods/AFlow/config/config2.example.yaml"
native_datasets = ["GSM8K", "MATH"]
execution_mode = "validation_search_then_frozen_test"
default_workflow = "official round_1 Custom node used as search round 0"
search_protocol = "aflow-validation-graph-search-v1"
entrypoint = "scripts/run_aflow.sh"

[workflow]
id = "official-round-1-custom"
output = "answer"

[[workflow.nodes]]
id = "answer"
operator = "custom"
instruction = ""
inputs = []

[workflow_artifact]
source = "AFlow workspace/MATH and workspace/GSM8K round_1"
optimization_split = "none"
optimization_cost = 0
evaluation_data_used = false
frozen = true

[fairness]
min_model_calls_per_problem = 1
max_model_calls_per_problem = 1
allowed_inference_overrides = []

[constraints]
online_optimization_on_evaluation_data = false
custom_workflow_requires_frozen_artifact = true
